name: Observatório 360 — Evidências visuais
on:
  pull_request:
    paths:
      - 'demo/**'
      - 'browser-tests/visual-consistency.spec.cjs'
      - '.github/workflows/observatorio-visual-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capturas:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - name: Obter código da candidata
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências verificadas
        run: npm ci
      - name: Verificar composição e gerar imagens em 320, 390 e 1440px
        env:
          CI: 'true'
        run: npx playwright test browser-tests/visual-consistency.spec.cjs
      - name: Preservar capturas para revisão manual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-360-evidencias-visuais
          path: visual-evidence/*.png
          if-no-files-found: error
          retention-days: 7
