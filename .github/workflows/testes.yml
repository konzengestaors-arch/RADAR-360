name: RADAR 360 — Testes Node
on:
  push:
    branches: [main, codex/desenvolvimento, codex/portal-editorial-20261107, codex/capa-inteligencia-20261107, codex/investimentos-fontes-oficiais-20261107, codex/investimentos-consolidados-20261107, codex/brde-rss-regional-20261107]
  pull_request:
    branches: [main, codex/desenvolvimento, codex/portal-editorial-20261107, codex/capa-inteligencia-20261107, codex/investimentos-fontes-oficiais-20261107, codex/investimentos-consolidados-20261107, codex/brde-rss-regional-20261107]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e testes de regressão
        run: npm run check
  navegador:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Autorizar checkout verificado no contêiner GitHub Actions
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Construir pacote Android para ensaio Chromium
        run: node scripts/build-android.cjs
      - name: Testes funcionais
        run: npm run test:browser
      - name: Estabilidade — restauração e backup (3 repetições sem retry)
        run: npx playwright test browser-tests/integridade-storage.spec.cjs browser-tests/comercial-demo.spec.cjs --grep 'restauração|restaura|backup' --repeat-each=3 --workers=1

      - name: Capturas da composição editorial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-editorial-${{ github.sha }}
          path: test-results/editorial-*.png
          if-no-files-found: ignore
