name: Observatorio 360 — QA sintetico isolado
on:
  push:
    branches:
      - qa/observatorio-dados-sinteticos-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e regressao Node
        run: npm run check
  fontes-publicas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sonda externa (resultado nao bloqueia regressao)
        id: probe
        continue-on-error: true
        run: node scripts/probe-fontes-publicas.cjs > resultado-fontes-publicas.json
      - name: Mostrar resultado da sonda
        if: always()
        run: |
          if test -f resultado-fontes-publicas.json; then cat resultado-fontes-publicas.json; else echo '{"error":"probe_no_output"}'; fi
      - name: Arquivar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-fontes-publicas
          path: resultado-fontes-publicas.json
          if-no-files-found: warn
  google-news-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consulta Google Noticias RSS
        continue-on-error: true
        run: node scripts/probe-google-news-rss.cjs > resultado-google-news.json
      - name: Mostrar resultado
        if: always()
        run: cat resultado-google-news.json
      - name: Arquivar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-google-news-rss
          path: resultado-google-news.json
          if-no-files-found: warn
  capa-android:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias e Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validar capa em Android e desktop
        run: npx playwright test browser-tests/capa-news-first-qa.spec.cjs
      - name: Evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-capa-android
          path: test-results/
          if-no-files-found: warn
