name: Observatorio 360 — QA sintetico isolado
on:
  push:
    branches:
      - qa/observatorio-dados-sinteticos-20261110
      - qa/observatorio-catalogo-privado-https-20261116
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node22:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e regressao Node
        run: |
          npm run check
          node --check demo/apuracoes-privadas-qa.js
          node --check demo/pwa-qa-sw.js
          node --check demo/pwa-qa.js
  fontes-publicas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sonda externa (resultado nao bloqueia regressao)
        id: probe
        continue-on-error: true
        run: node scripts/probe-fontes-publicas.cjs > resultado-fontes-publicas.json
      - name: Mostrar resultado da sonda
        if: always()
        run: |
          if test -f resultado-fontes-publicas.json; then cat resultado-fontes-publicas.json; else echo '{"error":"probe_no_output"}'; fi
      - name: Arquivar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-fontes-publicas
          path: resultado-fontes-publicas.json
          if-no-files-found: warn
  google-news-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consulta Google Noticias RSS
        continue-on-error: true
        run: node scripts/probe-google-news-rss.cjs > resultado-google-news.json
      - name: Mostrar resultado
        if: always()
        run: cat resultado-google-news.json
      - name: Arquivar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-google-news-rss
          path: resultado-google-news.json
          if-no-files-found: warn
  integracao-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar coletor real e API
        continue-on-error: true
        run: node scripts/qa-noticias-integracao-real.cjs
  capa-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencias e Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --only-shell chromium
      - name: Validar capa em Android e desktop
        run: npx playwright test browser-tests/capa-news-first-qa.spec.cjs browser-tests/noticias-visiveis.spec.cjs browser-tests/catalogo-privado-222.spec.cjs browser-tests/apuracoes-privadas-qa.spec.cjs browser-tests/pwa-install-qa.spec.cjs
      - name: Evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-capa-android
          path: test-results/
          if-no-files-found: warn

  rotas-privadas:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Anônimo não acessa o catálogo Supabase nem a API Vercel
        shell: bash
        run: |
          set -euo pipefail
          supabase_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            'https://dulbmxowopxahvfgswou.supabase.co/functions/v1/observatorio360-bridge-qa')"
          case "$supabase_code" in
            401|403) echo "Supabase: acesso anônimo negado" ;;
            *) echo "::error::Supabase não bloqueou acesso anônimo ($supabase_code)"; exit 1 ;;
          esac
          vercel_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            'https://radar-360-homologacao-isolada-pxjw193b8-konzengestaors-2191.vercel.app/api/empresas')"
          case "$vercel_code" in
            401|403|302|303|307|308) echo "Vercel SSO: acesso anônimo negado" ;;
            *) echo "::error::Vercel não confirmou bloqueio por SSO ($vercel_code)"; exit 1 ;;
          esac
          new_edge_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            'https://dulbmxowopxahvfgswou.supabase.co/functions/v1/observatorio360-private-p4-qa')"
          case "$new_edge_code" in
            401|403) echo "Nova API de sessões: acesso anônimo negado" ;;
            *) echo "::error::Nova API de sessões aceitou acesso anônimo ($new_edge_code)"; exit 1 ;;
          esac
          current_preview_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            'https://radar-360-homologacao-isolada-q4158n1wy-konzengestaors-2191.vercel.app/api/sessao')"
          case "$current_preview_code" in
            401|403|302|303|307|308) echo "Prévia atual: sessão anônima negada por SSO" ;;
            *) echo "::error::Prévia atual não está protegida ($current_preview_code)"; exit 1 ;;
          esac
